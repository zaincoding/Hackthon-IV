## AI Integration Endpoints
### POST /api/v1/ai/chat
**Purpose**: Process natural language input and manage todos

**Request**:
```json
{
  "session_id": "string",
  "message": "string"
}
```

**Response**:
```json
{
  "response": "string",
  "actions": [
    {
      "type": "create_todo|update_todo|delete_todo|complete_todo|get_todos",
      "data": {}
    }
  ]
}
```

## Service Discovery Requirements
Within the Kubernetes cluster, the frontend service must be able to reach the backend service at:
- `http://todo-backend:8000` (using Kubernetes internal DNS)

The frontend will use this internal service address for API calls, and should pass this information in its configuration to connect to the backend.