# API Contract: Todo Chatbot Backend Service

## Overview
This document defines the API contract for the backend service of the Todo Chatbot application. This is the existing API that needs to be accessible from the frontend service within the Kubernetes cluster.

## Base URL
The backend service will be accessible within the Kubernetes cluster at:
- Internal service URL: `http://todo-backend.todo-app.svc.cluster.local:8000`
- In-cluster address: `todo-backend:8000`

## Health Check Endpoint
### GET /health
**Purpose**: Check the health status of the backend service

**Response**:
```json
{
  "status": "healthy",
  "service": "todo-chatbot-backend",
  "metrics": {
    "response_time": 0.0,
    "error_rate": 0,
    "health_status": "unknown"
  }
}
```

## Session Management Endpoints
### POST /api/v1/sessions/
**Purpose**: Create a new user session

**Request**:
```json
{}
```

**Response**:
```json
{
  "session_id": "string",
  "created_at": "timestamp"
}
```

### GET /api/v1/sessions/{session_id}
**Purpose**: Get session details

**Response**:
```json
