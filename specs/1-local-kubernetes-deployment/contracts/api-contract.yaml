## Todo Management Endpoints
### GET /api/v1/todos/
**Purpose**: Retrieve all todos for a session

**Query Parameters**:
- `session_id` (required): The user session ID

**Response**:
```json
[
  {
    "id": "string",
    "title": "string",
    "description": "string",
    "due_date": "string",
    "priority": "string",
    "category": "string",
    "status": "string",
    "session_id": "string",
    "created_at": "timestamp",
    "updated_at": "timestamp"
  }
]
```

### POST /api/v1/todos/
**Purpose**: Create a new todo

**Request**:
```json
{
  "session_id": "string",
  "title": "string",
  "description": "string",
  "due_date": "string",
  "priority": "string",
  "category": "string"
}
```

**Response**:
```json
{
  "id": "string",
  "title": "string",
  "description": "string",
  "due_date": "string",
  "priority": "string",
  "category": "string",
  "status": "pending",
  "session_id": "string",
  "created_at": "timestamp",
  "updated_at": "timestamp"
}
```

### PUT /api/v1/todos/{todo_id}
**Purpose**: Update an existing todo

**Path Parameter**:
- `todo_id` (required): The ID of the todo to update

**Request**:
```json
{
  "title": "string",
  "description": "string",
  "due_date": "string",
  "priority": "string",
  "category": "string",
