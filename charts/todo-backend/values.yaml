# Default values for todo-backend
replicaCount: 1

image:
  repository: todo-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "todo-backend"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables
env:
  - name: APP_NAME
    value: "AI-Powered Todo Chatbot"
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "8000"
  - name: DEBUG
    value: "False"
  - name: RELOAD
    value: "False"
  - name: SESSION_TIMEOUT_HOURS
    value: "24"
  - name: MAX_TODOS_PER_SESSION
    value: "1000"
  - name: MAX_SESSION_MEMORY_MB
    value: "5.0"
  - name: OPENAI_MODEL
    value: "gpt-4-turbo-preview"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: todo-backend-secrets
        key: database-url

# Database configuration
database:
  url: "postgresql://neondb_owner:$(DATABASE_PASSWORD)@ep-fancy-union-ahe34rqh-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"